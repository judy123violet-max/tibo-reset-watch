# Tibo Codex 额度重置监控（云端定时）
# 产出方 WorkBuddy / 2026-10-23 / 初版
#
# 作用：GitHub 服务器每 5 分钟跑一次脚本，抓 ModelYard 的 Tibo 重置公告，
#       有新的「计划重置 / 重置完成 / 重置卡」就推一条到你微信。
#       电脑关机也照跑。
#
# 需要配置的仓库 Secret（Settings → Secrets and variables → Actions）：
#   SERVERCHAN_SENDKEY      Server酱 SendKey（当前使用，2026-10-23 已实测可送达）
#   或 PUSHPLUS_TOKEN       PushPlus 的 token（需先付费实名，暂未采用）
#   或 WECOM_WEBHOOK        企业微信群机器人 webhook（收不到个人微信）
#
# 注意：GitHub 的定时任务在高峰期会延迟几分钟到十几分钟才触发，这是平台特性，改不了。

name: tibo-reset-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "勾上则只发一条测试消息（不去重、不改 state）"
        type: boolean
        default: false

permissions:
  contents: write         # 需要回写 state.json 做去重

concurrency:
  group: tibo-reset-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3     # 必须小于 cron 的 5 分钟，否则跑满被杀会导致 state 没回写（dsh 复核提出）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 回写 state 需要能 pull --rebase，浅克隆会失败

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 跑一轮监控
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_CHANNEL: ${{ vars.PUSHPLUS_CHANNEL }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          TZ: Asia/Shanghai
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            echo "== 测试模式：推一条测试消息 =="
            python tibo_reset_watch.py --test
          else
            python tibo_reset_watch.py
          fi

      - name: 回写去重状态
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "tibo-watch-bot"
            git config user.email "tibo-watch-bot@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update seen state [skip ci]"
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} || true
            # 推失败必须让这一步变红：state 没回写的话下轮 checkout 会丢掉它，
            # 结果是同一条公告再推一次（dsh 复核指出）
            git push || { echo "::error::state 回写失败，下一轮可能重复推送"; exit 1; }
          else
            echo "state.json 无变化，跳过提交"
          fi
